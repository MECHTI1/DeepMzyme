name: CPU CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Create locked Python 3.12 CPU environment
        run: uv sync --frozen --no-default-groups --group test
      - name: CLI help
        run: uv run --frozen --no-sync python src/train.py --help
      - name: Pytest suite
        run: uv run --frozen --no-sync pytest
      - name: Compatibility smoke wrapper
        run: uv run --frozen --no-sync python tests/smoke_checks.py
